aruco_detector:
  ros__parameters:
    image_topic: /camera/image/compressed    # compressed image stream topic 
    marker_array_topic: /marker_array        # array with marker id topic 

take_photo_service:
  ros__parameters:
    image_topic: /camera/image/compressed    
    marker_image_topic: /marker_image        # id image topic 
    show_image: true

fsm_node:
  ros__parameters:
    marker_array_topic: /marker_array
    odom_topic: /odometry/filtered           # odometry topic 
    cmd_vel_topic: /cmd_vel                  # velocity topic 
    camera_info_topic: /camera/camera_info   # camera topic 

    reference_side: 166.0     # pixel value for reference 
    reference_fx: 381.36      # value reference scaled 

    # gains and tolerances
    forward_speed: 0.2        # m/s, while searching for the marker
    k_omega: 0.002            # omega = -k_omega * (u - cx)
    k_v: 0.005                # v = k_v * (sd - s)
    u_tolerance: 20.0         # px
    side_tolerance: 5.0       # px
    k_rot: 0.8                # rotation gain on the yaw error
    yaw_tolerance: 0.05       # rad
